name: Organize LeetCode Solutions

on:
  push:
    paths:
      - '*-*/*'
      - '*-*/*.*'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leethub-organize
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Organize LeetCode solutions
        shell: bash
        run: |
          set -e

          mkdir -p Leetcode/Easy
          mkdir -p Leetcode/Medium
          mkdir -p Leetcode/Hard

          for dir in *-*; do
            if [ -d "$dir" ] && [ "$dir" != "Leetcode" ]; then

              cpp_file=$(find "$dir" -maxdepth 1 -type f -name "*.cpp" | head -n 1)
              readme_file=$(find "$dir" -maxdepth 1 -type f -name "README.md" | head -n 1)

              if [ -n "$cpp_file" ]; then

                folder_name=$(basename "$dir")

                problem_number=$(echo "$folder_name" | grep -oE '^[0-9]+')
                problem_title=$(echo "$folder_name" | sed -E 's/^[0-9]+[-_ ]*//')

                if [ -n "$problem_number" ] && [ -n "$problem_title" ]; then

                  padded_number=$(printf "%04d" "$((10#$problem_number))")
                  slug=$(echo "$problem_title" | tr '[:upper:]' '[:lower:]')

                  difficulty=""

                  api_response=$(curl -s -X POST https://leetcode.com/graphql \
                    -H "Content-Type: application/json" \
                    -d "{\"query\":\"query q(\$titleSlug: String!) { question(titleSlug: \$titleSlug) { difficulty } }\",\"variables\":{\"titleSlug\":\"${slug}\"}}" || true)

                  api_difficulty=$(echo "$api_response" | grep -oE '"difficulty":"(Easy|Medium|Hard)"' | grep -oE '(Easy|Medium|Hard)' || true)

                  if [ -n "$api_difficulty" ]; then
                    difficulty="$api_difficulty"
                    echo "Difficulty for $folder_name via LeetCode API: $difficulty"

                  elif [ -n "$readme_file" ]; then
                    if grep -qi "Easy" "$readme_file"; then
                      difficulty="Easy"
                    elif grep -qi "Medium" "$readme_file"; then
                      difficulty="Medium"
                    elif grep -qi "Hard" "$readme_file"; then
                      difficulty="Hard"
                    fi
                    if [ -n "$difficulty" ]; then
                      echo "Difficulty for $folder_name via README fallback: $difficulty"
                    fi
                  fi

                  if [ -z "$difficulty" ]; then
                    echo "Could not determine difficulty for $folder_name (API and README both failed)"
                    echo "Skipping $folder_name"
                    continue
                  fi

                  echo "Found: $folder_name"

                  mv "$cpp_file" "Leetcode/$difficulty/${padded_number}-${problem_title}.cpp"

                  rm -rf "$dir"

                fi
              else
                echo "Waiting on missing .cpp file for $dir — leaving as-is"
              fi
            fi
          done

      - name: Commit organized files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Organize LeetCode solutions"

          attempt=0
          until git push
          do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi
            echo "Push rejected, rebasing onto latest and retrying ($attempt/5)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
